events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Rate Limiting: 10 requests/second per IP address
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;

    upstream monitor_backend {
        server monitor-service:8080;
    }

    # HTTP Server - Redirect all HTTP traffic to HTTPS
    server {
        listen 80;
        server_name localhost;

        location /health {
            proxy_pass http://monitor_backend/health;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server - SSL Termination & Reverse Proxy
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Rate Limiting with burst
        limit_req zone=api_limit burst=20 nodelay;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Health endpoint
        location = /health {
            proxy_pass http://monitor_backend/health;
        }

        # Public Auth Login
        location = /api/v1/auth/login {
            proxy_pass http://monitor_backend/api/v1/auth/login;
        }

        # Internal Auth Validation Endpoint (called via auth_request)
        location = /api/v1/auth/validate {
            internal;
            proxy_pass http://monitor_backend/api/v1/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization;
        }

        # Protected Services Management Endpoints
        location /api/v1/services {
            auth_request /api/v1/auth/validate;
            auth_request_set $auth_user $upstream_http_x_user_id;
            proxy_set_header X-User-ID $auth_user;
            proxy_pass http://monitor_backend/api/v1/services;
        }

        # Fallback proxy for all other /api/ routes
        location /api/ {
            proxy_pass http://monitor_backend;
        }
    }
}
