services:
  # -------------------------------------------------------------
  # Infrastructure: PostgreSQL Database
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: service-monitor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: service_monitor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d service_monitor"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Infrastructure: Apache Kafka (KRaft mode - no Zookeeper)
  # -------------------------------------------------------------
  kafka:
    image: bitnami/kafka:3.7
    container_name: service-monitor-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_ENABLE_KRAFT=yes
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    volumes:
      - kafkadata:/bitnami/kafka/data

  # -------------------------------------------------------------
  # Monitored Target Microservices (for probing & outage testing)
  # -------------------------------------------------------------
  payment-service:
    build:
      context: ..
      dockerfile: cmd/payment-service/Dockerfile
    container_name: payment-service
    restart: unless-stopped
    ports:
      - "8081:8081"

  order-service:
    build:
      context: ..
      dockerfile: cmd/order-service/Dockerfile
    container_name: order-service
    restart: unless-stopped
    ports:
      - "8082:8082"

  # -------------------------------------------------------------
  # Core Platform: Notification Service (gRPC server)
  # -------------------------------------------------------------
  notification-service:
    build:
      context: ..
      dockerfile: cmd/notification/Dockerfile
    container_name: notification-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NOTIFICATION_GRPC_PORT=:50051
      - NOTIFICATION_METRICS_ADDR=:8084
      - DATABASE_URL=postgres://postgres:postgrespassword@postgres:5432/service_monitor?sslmode=disable
      - LOG_LEVEL=info
    ports:
      - "50051:50051"
      - "8084:8084"

  # -------------------------------------------------------------
  # Core Platform: Incident Service (Kafka consumer -> gRPC client)
  # -------------------------------------------------------------
  incident-service:
    build:
      context: ..
      dockerfile: cmd/incident/Dockerfile
    container_name: incident-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      notification-service:
        condition: service_started
    environment:
      - METRICS_ADDR=:8083
      - DATABASE_URL=postgres://postgres:postgrespassword@postgres:5432/service_monitor?sslmode=disable
      - KAFKA_BROKER=kafka:9092
      - KAFKA_TOPIC=service-events
      - KAFKA_GROUP_ID=incident-service-group
      - NOTIFICATION_GRPC_ADDR=notification-service:50051
      - LOG_LEVEL=info
    ports:
      - "8083:8083"

  # -------------------------------------------------------------
  # Core Platform: Monitor Service (Worker pool + REST API)
  # -------------------------------------------------------------
  monitor-service:
    build:
      context: ..
      dockerfile: cmd/monitor/Dockerfile
    container_name: monitor-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      - SERVER_ADDR=:8080
      - HEALTH_CHECK_INTERVAL=5s
      - HEALTH_REQUEST_TIMEOUT=3s
      - HEALTH_WORKER_COUNT=5
      - DATABASE_URL=postgres://postgres:postgrespassword@postgres:5432/service_monitor?sslmode=disable
      - KAFKA_BROKER=kafka:9092
      - KAFKA_TOPIC=service-events
      - JWT_SECRET=super-secret-jwt-key-for-service-monitor
      - LOG_LEVEL=info
    ports:
      - "8080:8080"

  # -------------------------------------------------------------
  # Edge Gateway: Nginx Reverse Proxy (SSL, Auth & Rate Limiting)
  # -------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: service-monitor-gateway
    restart: unless-stopped
    depends_on:
      - monitor-service
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro

  # -------------------------------------------------------------
  # Observability: Prometheus
  # -------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: service-monitor-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  # -------------------------------------------------------------
  # Observability: Grafana
  # -------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: service-monitor-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards/json:ro

volumes:
  pgdata:
  kafkadata:
